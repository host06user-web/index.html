<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Planner Casa - Planta Baixa 2D</title>
    <!-- Carregando biblioteca Fabric.js (para desenho vetorial e suporte a toque) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
    <style>
        body { margin: 0; font-family: sans-serif; background: #f0f0f0; overflow: hidden; }
        
        /* Barra de ferramentas responsiva */
        #toolbar { 
            background: #333; color: white; padding: 10px; display: flex; gap: 10px; flex-wrap: wrap;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3); z-index: 10; position: relative;
        }
        button, select {
            padding: 8px 12px; border: none; border-radius: 5px; cursor: pointer;
            background: #555; color: white; font-size: 14px; touch-action: manipulation;
        }
        button:hover, select:hover { background: #777; }
        button.active { background: #4CAF50; }
        
        /* Área do Canvas */
        #canvas-container {
            width: 100%; height: calc(100vh - 50px); background: #e0e0e0;
        }
        canvas { display: block; }

        /* Painel de propriedades (escondido no tablet para não atrapalhar) */
        #prop-panel {
            position: absolute; right: 10px; top: 60px; background: rgba(255,255,255,0.95);
            padding: 10px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); display: none;
            font-size: 12px; max-width: 200px;
        }
        #prop-panel input { width: 100%; margin-bottom: 5px; }
        
        /* Instruções rápidas */
        #status { position: absolute; left: 10px; bottom: 10px; background: white; padding: 5px; border-radius: 5px; }
    </style>
</head>
<body>
    <div id="toolbar">
        <h3 style="margin:0 10px 0 0;">🏠 Editor</h3>
        <button id="btn-select" class="active">🖱️ Selecionar</button>
        <button id="btn-wall">🧱 Parede</button>
        <button id="btn-door">🚪 Porta</button>
        <button id="btn-window">🪟 Janela</button>
        <select id="furniture-select">
            <option value="">Móveis...</option>
            <option value="cama">Cama</option>
            <option value="sofa">Sofá</option>
            <option value="mesa">Mesa</option>
        </select>
        <button id="btn-measure">📏 Medir</button>
        <button id="btn-delete">🗑️ Excluir</button>
        <button id="btn-clear">Limpar Tudo</button>
    </div>

    <div id="canvas-container"></div>
    
    <div id="prop-panel">
        <strong>Propriedades</strong><br>
        <label>Comprimento (cm): <input type="number" id="prop-len"></label>
        <label>Espessura (cm): <input type="number" id="prop-thick"></label>
    </div>

    <div id="status">Clique em "Parede" para começar a desenhar!</div>

    <script>
        // ==================== CONFIGURAÇÃO ====================
        const canvas = new fabric.Canvas('c', {
            selection: true,
            preserveObjectStacking: true,
            backgroundColor: '#fff'
        });

        // Responsividade: Ajustar o canvas para o tamanho da tela
        const container = document.getElementById('canvas-container');
        function resizeCanvas() {
            canvas.setWidth(container.clientWidth);
            canvas.setHeight(container.clientHeight);
            canvas.renderAll();
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Variáveis de estado
        let currentTool = 'select';
        let startPoint = null;
        let currentWall = null;
        let currentLine = null;

        // ==================== FUNÇÕES BÁSICAS ====================
        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('button').forEach(btn => btn.classList.remove('active'));
            if (tool === 'select') document.getElementById('btn-select').classList.add('active');
            if (tool === 'wall') document.getElementById('btn-wall').classList.add('active');
            if (tool === 'door') document.getElementById('btn-door').classList.add('active');
            if (tool === 'window') document.getElementById('btn-window').classList.add('active');
            if (tool === 'measure') document.getElementById('btn-measure').classList.add('active');
            
            if (tool !== 'select') canvas.selection = false;
            else canvas.selection = true;
        }

        // Criação de objetos visuais
        function createWall(x1, y1, x2, y2) {
            const wall = new fabric.Line([x1, y1, x2, y2], {
                stroke: '#000',
                strokeWidth: 10, // Espessura da parede
                selectable: true,
                hasBorders: false,
                perPixelTargetFind: true, // Permite clicar na linha grossa
                objectCaching: false
            });
            wall.customType = 'wall';
            return wall;
        }

        function createDoor(x, y, angle, width = 50) {
            const group = new fabric.Group([
                new fabric.Line([0, 0, width, 0], { stroke: '#e67e22', strokeWidth: 3 }),
                new fabric.Circle({ radius: 10, left: width/2 - 10, top: -5, fill: 'transparent', stroke: '#e67e22' })
            ], { left: x, top: y, angle: angle, originX: 'center', originY: 'center' });
            group.customType = 'door';
            return group;
        }

        function createWindow(x1, y1, x2, y2) {
            const windowLine = new fabric.Line([x1, y1, x2, y2], {
                stroke: '#3498db', strokeWidth: 4, selectable: true
            });
            windowLine.customType = 'window';
            return windowLine;
        }

        function createFurniture(type, x, y) {
            let obj;
            if (type === 'cama') {
                obj = new fabric.Rect({ width: 80, height: 120, fill: '#ecf0f1', stroke: '#333', strokeWidth: 2 });
                obj.customType = 'cama';
                obj.set({ left: x, top: y });
            } else if (type === 'sofa') {
                obj = new fabric.Rect({ width: 150, height: 60, fill: '#e74c3c', stroke: '#333', strokeWidth: 2 });
                obj.customType = 'sofa';
                obj.set({ left: x, top: y });
            } else if (type === 'mesa') {
                obj = new fabric.Rect({ width: 80, height: 80, fill: '#f1c40f', stroke: '#333', strokeWidth: 2 });
                obj.customType = 'mesa';
                obj.set({ left: x, top: y });
            }
            obj.set({ originX: 'center', originY: 'center' });
            return obj;
        }

        // ==================== EVENTOS DE INTERAÇÃO ====================
        canvas.on('mouse:down', function(opt) {
            const pointer = canvas.getPointer(opt.e);
            
            if (currentTool === 'wall') {
                if (!startPoint) {
                    startPoint = { x: pointer.x, y: pointer.y };
                    currentLine = createWall(pointer.x, pointer.y, pointer.x, pointer.y);
                    canvas.add(currentLine);
                } else {
                    // Fecha a parede
                    const endPoint = { x: pointer.x, y: pointer.y };
                    // Adiciona medida (cota) na parede
                    addMeasurement(startPoint, endPoint);
                    startPoint = null;
                    currentLine = null;
                }
            } 
            else if (currentTool === 'door') {
                const door = createDoor(pointer.x, pointer.y, 45, 60);
                canvas.add(door);
            }
            else if (currentTool === 'window') {
                const windowObj = createWindow(pointer.x-30, pointer.y, pointer.x+30, pointer.y);
                canvas.add(windowObj);
            }
            else if (currentTool === 'measure') {
                if (!startPoint) {
                    startPoint = pointer;
                } else {
                    addMeasurement(startPoint, pointer);
                    startPoint = null;
                }
            }
            else if (currentTool === 'select') {
                // Lógica de seleção já é feita pelo Fabric.js automaticamente
            }
        });

        // Desenhar paredes dinamicamente
        canvas.on('mouse:move', function(opt) {
            if (currentTool === 'wall' && startPoint) {
                const pointer = canvas.getPointer(opt.e);
                currentLine.set({ x2: pointer.x, y2: pointer.y });
                canvas.renderAll();
            }
        });

        // Suporte a toque no tablet (Fabric.js já trata, mas aqui vai a dica)
        canvas.on('touch:gesture', function(opt) {
            // Permitir zoom e pan com gestos de pinça
            if (opt.e.touches && opt.e.touches.length === 2) {
                canvas.setZoom(canvas.getZoom() * 1.01);
                canvas.renderAll();
            }
        });

        // Painel de propriedades ao selecionar
        canvas.on('selection:created', updatePanel);
        canvas.on('selection:updated', updatePanel);
        canvas.on('selection:cleared', function() { document.getElementById('prop-panel').style.display = 'none'; });

        function updatePanel() {
            const activeObj = canvas.getActiveObject();
            if (!activeObj) return;
            
            const panel = document.getElementById('prop-panel');
            const lenInput = document.getElementById('prop-len');
            const thickInput = document.getElementById('prop-thick');
            
            if (activeObj.customType === 'wall') {
                panel.style.display = 'block';
                const len = Math.sqrt(Math.pow(activeObj.x2 - activeObj.x1, 2) + Math.pow(activeObj.y2 - activeObj.y1, 2)) / 2;
                lenInput.value = Math.round(len); // Convertendo pixel para cm (aprox)
                thickInput.value = activeObj.strokeWidth;
            } else {
                panel.style.display = 'none';
            }
        }

        // Função para criar as "Cotas" (Medidas) na planta
        function addMeasurement(p1, p2) {
            const dist = Math.sqrt(Math.pow(p2.x - p1.x, 2) + Math.pow(p2.y - p1.y, 2));
            const text = new fabric.Text(Math.round(dist) + ' cm', {
                fontSize: 14, fill: '#000', originX: 'center', originY: 'bottom',
                left: (p1.x + p2.x) / 2, top: (p1.y + p2.y) / 2 - 10
            });
            
            // Linha da cota
            const line = new fabric.Line([p1.x, p1.y, p2.x, p2.y], {
                stroke: '#555', strokeWidth: 1, strokeDashArray: [5, 5]
            });
            
            const group = new fabric.Group([line, text], { selectable: false, evented: false });
            canvas.add(group);
        }

        // ==================== CONTROLES DA BARRA ====================
        document.getElementById('btn-select').onclick = () => setTool('select');
        document.getElementById('btn-wall').onclick = () => setTool('wall');
        document.getElementById('btn-door').onclick = () => setTool('door');
        document.getElementById('btn-window').onclick = () => setTool('window');
        document.getElementById('btn-measure').onclick = () => setTool('measure');

        // Seleção de móveis
        document.getElementById('furniture-select').onchange = function(e) {
            const type = e.target.value;
            if (type) {
                const furniture = createFurniture(type, 300, 300);
                canvas.add(furniture);
                e.target.value = '';
            }
        };

        // Excluir e Limpar
        document.getElementById('btn-delete').onclick = () => {
            const activeObjs = canvas.getActiveObjects();
            if (activeObjs.length) {
                canvas.discardActiveObject();
                activeObjs.forEach(obj => canvas.remove(obj));
                canvas.renderAll();
            }
        };

        document.getElementById('btn-clear').onclick = () => {
            canvas.clear();
            canvas.backgroundColor = '#fff';
            canvas.renderAll();
        };

        // Zoom e pan (deslocamento)
        canvas.on('mouse:wheel', function(opt) {
            const delta = opt.e.deltaY;
            let zoom = canvas.getZoom();
            zoom *= 0.999 ** delta;
            if (zoom > 20) zoom = 20;
            if (zoom < 0.5) zoom = 0.5;
            canvas.setZoom(zoom);
            canvas.renderAll();
        });

        // Botões de utilidade
        document.getElementById('btn-clear').onclick = function() {
            if(confirm("Tem certeza que deseja limpar todo o projeto?")) {
                canvas.clear();
                canvas.backgroundColor = '#fff';
                canvas.renderAll();
            }
        };
    </script>
</body>
</html>
